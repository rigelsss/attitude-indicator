; ESP A — "AVIÃO": sensores, fusão de atitude, envio ESP-NOW, OLED de status
[env:aircraft]
platform      = espressif32 @ 6.13.0   ; versões exatas: build reprodutível
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
upload_port   = COM7
monitor_port  = COM7
; As duas placas usam a COM7 (uma de cada vez): a porta não identifica a placa.
; Antes de gravar, o script confere o MAC e cancela se for a Placa B
extra_scripts    = pre:../shared/scripts/check_board_mac.py
custom_board_mac = 1C:69:20:A4:E9:44

build_flags =
    -I ../shared/include
    -D CORE_DEBUG_LEVEL=3
; src/diag/ pertence ao ambiente i2cscan
build_src_filter = +<*> -<diag/>

; MPU6050, BME280 e HMC5883L: drivers próprios em lib/mpu6050, lib/bme280 e lib/hmc5883l
; (registradores, sem biblioteca externa)
lib_deps =
    olikraus/U8g2 @ 2.36.18                    ; OLED 0,91" SSD1306 128x32

[env:i2cscan]
; Diagnóstico: scan I2C + identificação dos chips + leitura bruta do MPU6050.
; Compila só src/diag/ (sem main.cpp). Gravar: pio run -e i2cscan -t upload
extends          = env:aircraft
build_src_filter = +<diag/>
lib_deps         =

[env:native]
; Testes de lógica pura (fusão, calibração) rodando no PC: pio test -e native
platform    = native
build_flags = -I ../shared/include
test_build_src = no
