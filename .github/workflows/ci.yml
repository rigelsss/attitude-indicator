# CI: testes de lógica pura (native e pytest do cliente Python) e compilação dos ambientes de firmware a cada
# push e pull request.
# Nada é gravado em placa: o check_board_mac.py só age antes de upload/uploadfs.
name: CI

on:
  push:
  pull_request:

jobs:
  testes-native:
    name: Testes native (aircraft e ground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('firmware/*/platformio.ini') }}
      - name: Instalar o PlatformIO
        run: pip install platformio==6.2.0
      - name: pio test -e native (aircraft)
        working-directory: firmware/aircraft
        run: pio test -e native
      - name: pio test -e native (ground)
        working-directory: firmware/ground
        run: pio test -e native

  testes-python:
    name: Testes do cliente Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar o pytest, o websockets e o matplotlib
        run: pip install "pytest>=8.0" "websockets>=16.0" "matplotlib>=3.9"
      - name: python -m pytest (lógica pura, integração com o simulador do B e figuras sem janela)
        working-directory: ground-station/python
        run: python -m pytest -q

  compilacao:
    name: Compilação (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: firmware/aircraft
            env: aircraft
          - dir: firmware/aircraft
            env: aircraft_pulsetest
          - dir: firmware/aircraft
            env: i2cscan
          - dir: firmware/ground
            env: ground
          - dir: firmware/ground
            env: ground_diag
          - dir: firmware/ground
            env: ground_ws20
          - dir: firmware/ground
            env: ground_estavel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/*/platformio.ini') }}
      - name: Instalar o PlatformIO
        run: pip install platformio==6.2.0
      - name: pio run -e ${{ matrix.env }}
        working-directory: ${{ matrix.dir }}
        run: pio run -e ${{ matrix.env }}
