<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="titulo">
  <title id="titulo">Ligação da fita de LEDs no ESP B: GPIO 27, conversor BSS138 e resistor de 330 ohms até o DIN do anel de cima, na tampa; o DOUT dele volta pelo conector 1 ao DIN do anel lateral. Os 5 V vêm do power bank por um cabo USB e um jack P4, com capacitor de 1000 microfarads; o GND é comum. Potenciômetro do brilho no GPIO 34</title>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .l { stroke: #1f2328; fill: none; stroke-width: 1.4; }
    .box { stroke: #1f2328; fill: #8c959f; fill-opacity: .10; stroke-width: 1.4; }
    .zone { stroke: #8c959f; fill: none; stroke-width: 1; stroke-dasharray: 2 4; }
    .strip { stroke: #1f2328; fill: #8c959f; fill-opacity: .18; stroke-width: 1.2; }
    .led { fill: #ffffff; stroke: #8c959f; }
    .pad { fill: #d4a72c; stroke: #9a6700; stroke-width: .8; }
    .v5 { stroke: #d1242f; fill: none; stroke-width: 2; }
    .gnd { stroke: #57606a; fill: none; stroke-width: 2; }
    .v33 { stroke: #bc4c00; fill: none; stroke-width: 2; }
    .dat { stroke: #1a7f37; fill: none; stroke-width: 2; }
    .g { stroke: #59636e; fill: none; stroke-width: 1; }
    .tv5 { fill: #d1242f; font-weight: bold; }
    .tgnd { fill: #57606a; font-weight: bold; }
    .tv33 { fill: #bc4c00; font-weight: bold; }
    .tdat { fill: #1a7f37; font-weight: bold; }
    .dv5 { fill: #d1242f; }
    .dgnd { fill: #57606a; }
    .ddat { fill: #1a7f37; }
    .div { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .l, .box, .strip { stroke: #e6edf3; }
      .led { fill: #0d1117; stroke: #9198a1; }
      .gnd { stroke: #9198a1; }
      .tgnd, .dgnd { fill: #9198a1; }
      .dat { stroke: #3fb950; }
      .tdat, .ddat { fill: #3fb950; }
      .v33 { stroke: #f0883e; }
      .tv33 { fill: #f0883e; }
      .v5 { stroke: #ff6a69; }
      .tv5, .dv5 { fill: #ff6a69; }
      .g { stroke: #9198a1; }
      .bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="800"/>
  <text class="t" x="500" y="24" font-size="16" font-weight="bold" text-anchor="middle">ESP B: fita de LEDs em dois anéis, em série</text>

  <!-- ===== TAMPA ===== -->
  <rect class="zone" x="10" y="38" width="980" height="204" rx="8"/>
  <text class="t" x="24" y="60" font-size="13" font-weight="bold">TAMPA</text>
  <text class="m" x="24" y="78" font-size="10">+5V e GND chegam pelo P4 (embaixo)</text>

  <rect class="strip" x="500" y="118" width="430" height="42" rx="5"/>
  <rect class="led" x="545" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="571" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="597" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="623" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="649" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="675" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="701" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="727" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="753" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="779" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="805" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="831" y="133" width="11" height="11" rx="2"/>
  <rect class="led" x="857" y="133" width="11" height="11" rx="2"/>
  <rect class="pad" x="492" y="123" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="130" font-size="8.5">VCC</text>
  <rect class="pad" x="492" y="136" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="143" font-size="8.5">GND</text>
  <rect class="pad" x="492" y="149" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="156" font-size="8.5">DIN</text>
  <rect class="pad" x="928" y="123" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="130" font-size="8.5" text-anchor="end">VCC</text>
  <rect class="pad" x="928" y="136" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="143" font-size="8.5" text-anchor="end">GND</text>
  <rect class="pad" x="928" y="149" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="156" font-size="8.5" text-anchor="end">DOUT</text>
  <text class="t" x="715" y="178" font-size="11" text-anchor="middle">Anel de cima: ~32 LEDs, sem canaleta (cantos com pontes de fio)</text>
  <line class="g" x1="620" y1="110" x2="810" y2="110" marker-end="url(#seta)"/>
  <text class="m" x="715" y="105" font-size="9" text-anchor="middle">sentido dos dados (seta impressa na fita)</text>

  <!-- alimentação do anel de cima, na entrada -->
  <path class="v5" d="M492 126.5 H468"/>
  <text class="tv5" x="464" y="130" font-size="10" text-anchor="end">+5V</text>
  <path class="gnd" d="M492 139.5 H468"/>
  <text class="tgnd" x="464" y="143" font-size="10" text-anchor="end">GND</text>
  <!-- DIN do anel de cima, vindo do conector 1 -->
  <path class="dat" d="M420 255 V152.5 H492"/>
  <text class="tdat" x="414" y="200" font-size="10" text-anchor="end">DIN</text>
  <!-- DOUT do anel de cima, de volta ao conector 1 -->
  <path class="dat" d="M938 152.5 H962 V214 H440 V255"/>
  <text class="tdat" x="700" y="209" font-size="10" text-anchor="middle">DOUT do anel de cima, de volta para a base</text>
  <text class="m" x="926" y="96" font-size="9" text-anchor="end">VCC e GND da saída: sem ligação</text>

  <!-- ===== divisa ===== -->
  <line class="div" x1="10" y1="255" x2="990" y2="255"/>
  <rect class="bg" x="560" y="246" width="250" height="18"/>
  <text class="m" x="685" y="259" font-size="10" text-anchor="middle">abertura da caixa (tampa | base)</text>
  <rect class="box" x="404" y="245" width="52" height="20" rx="3"/>
  <circle class="ddat" cx="420" cy="255" r="3"/>
  <circle class="ddat" cx="440" cy="255" r="3"/>
  <rect class="bg" x="226" y="246" width="172" height="18"/>
  <text class="t" x="396" y="259" font-size="10.5" text-anchor="end">conector 1 (DIN, DOUT) →</text>

  <!-- ===== BASE ===== -->
  <rect class="zone" x="10" y="270" width="980" height="520" rx="8"/>
  <text class="t" x="24" y="292" font-size="13" font-weight="bold">BASE</text>

  <!-- ESP32 B -->
  <rect class="box" x="30" y="305" width="130" height="175" rx="6"/>
  <text class="t" x="95" y="326" font-size="13" font-weight="bold" text-anchor="middle">ESP32 B</text>
  <text class="t" x="152" y="344" font-size="10" text-anchor="end">GPIO 27</text>
  <text class="t" x="152" y="379" font-size="10" text-anchor="end">3V3</text>
  <text class="t" x="152" y="414" font-size="10" text-anchor="end">GND</text>
  <text class="t" x="152" y="449" font-size="10" text-anchor="end">GPIO 34</text>
  <text class="t" x="95" y="474" font-size="9.5" text-anchor="middle">micro-USB</text>

  <!-- Conversor BSS138 -->
  <rect class="box" x="220" y="312" width="100" height="112" rx="6"/>
  <text class="t" x="270" y="304" font-size="10.5" font-weight="bold" text-anchor="middle">Conversor BSS138</text>
  <text class="t" x="226" y="344" font-size="9.5">LV1</text>
  <text class="t" x="226" y="379" font-size="9.5">LV</text>
  <text class="t" x="226" y="414" font-size="9.5">GND</text>
  <text class="t" x="314" y="344" font-size="9.5" text-anchor="end">HV1</text>
  <text class="t" x="314" y="379" font-size="9.5" text-anchor="end">HV</text>
  <text class="t" x="314" y="414" font-size="9.5" text-anchor="end">GND</text>
  <text class="m" x="270" y="397" font-size="8.5" text-anchor="middle">3,3 V → 5 V</text>

  <!-- ESP → conversor -->
  <path class="dat" d="M160 340 H220"/>
  <path class="v33" d="M160 375 H220"/>
  <path class="gnd" d="M160 410 H220"/>
  <!-- lado de 5 V do conversor -->
  <path class="v5" d="M320 375 H342"/>
  <text class="tv5" x="346" y="379" font-size="10">+5V</text>
  <path class="gnd" d="M320 410 H342"/>
  <text class="tgnd" x="346" y="414" font-size="10">GND</text>
  <!-- HV1 → 330 Ω → DIN -->
  <path class="dat" d="M320 340 H342"/>
  <rect class="l" x="342" y="334" width="40" height="12" rx="2"/>
  <text class="t" x="362" y="328" font-size="10" text-anchor="middle">330 Ω</text>
  <path class="dat" d="M382 340 H420 V255"/>

  <!-- DOUT do anel de cima → DIN do anel lateral -->
  <path class="dat" d="M440 255 V542.5 H492"/>
  <text class="tdat" x="446" y="470" font-size="10">DOUT → DIN</text>

  <rect class="strip" x="500" y="508" width="430" height="42" rx="5"/>
  <rect class="led" x="545" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="571" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="597" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="623" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="649" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="675" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="701" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="727" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="753" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="779" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="805" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="831" y="523" width="11" height="11" rx="2"/>
  <rect class="led" x="857" y="523" width="11" height="11" rx="2"/>
  <rect class="pad" x="492" y="513" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="520" font-size="8.5">VCC</text>
  <rect class="pad" x="492" y="526" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="533" font-size="8.5">GND</text>
  <rect class="pad" x="492" y="539" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="546" font-size="8.5">DIN</text>
  <rect class="pad" x="928" y="513" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="520" font-size="8.5" text-anchor="end">VCC</text>
  <rect class="pad" x="928" y="526" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="533" font-size="8.5" text-anchor="end">GND</text>
  <rect class="pad" x="928" y="539" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="546" font-size="8.5" text-anchor="end">DOUT</text>
  <text class="t" x="715" y="568" font-size="11" text-anchor="middle">Anel lateral: ~32 LEDs, na canaleta (contorna os cantos sem cortar)</text>
  <line class="g" x1="620" y1="500" x2="810" y2="500" marker-end="url(#seta)"/>
  <text class="m" x="715" y="495" font-size="9" text-anchor="middle">sentido dos dados (seta impressa na fita)</text>
  <text class="m" x="500" y="586" font-size="9">VCC e GND da entrada: sem ligação (a força entra pela outra ponta)</text>
  <!-- alimentação do anel lateral, pela ponta de saída -->
  <path class="v5" d="M938 516.5 H958"/>
  <text class="tv5" x="962" y="520" font-size="10">+5V</text>
  <path class="gnd" d="M938 529.5 H958"/>
  <text class="tgnd" x="962" y="533" font-size="10">GND</text>
  <text class="m" x="926" y="484" font-size="9" text-anchor="end">DOUT do fim: sem ligação</text>

  <!-- Potenciômetro do brilho -->
  <path class="dat" d="M160 445 H290"/>
  <circle class="ddat" cx="250" cy="445" r="3"/>
  <path class="dat" d="M250 445 V500" marker-end="url(#seta)"/>
  <rect class="l" x="215" y="504" width="70" height="13" rx="2"/>
  <path class="v33" d="M215 510.5 H196"/>
  <text class="tv33" x="192" y="514" font-size="10" text-anchor="end">3V3</text>
  <path class="gnd" d="M285 510.5 H304"/>
  <text class="tgnd" x="308" y="514" font-size="10">GND</text>
  <path class="l" d="M290 445 V456 M281 456 H299 M281 462 H299 M290 462 V472"/>
  <text class="tgnd" x="290" y="484" font-size="10" text-anchor="middle">GND</text>
  <text class="t" x="304" y="462" font-size="9.5">100 nF</text>
  <text class="t" x="250" y="535" font-size="10" text-anchor="middle">Potenciômetro 10 kΩ (brilho)</text>
  <text class="m" x="250" y="548" font-size="9" text-anchor="middle">extremos no 3V3, nunca no 5 V</text>

  <!-- Power bank -->
  <rect class="box" x="30" y="630" width="160" height="130" rx="8"/>
  <text class="t" x="110" y="696" font-size="13" font-weight="bold" text-anchor="middle">Power bank</text>
  <text class="t" x="95" y="648" font-size="9.5" text-anchor="middle">USB 1</text>
  <text class="t" x="184" y="714" font-size="9.5" text-anchor="end">USB 2</text>
  <!-- USB 1 → ESP -->
  <path class="v5" d="M95 630 V480"/>
  <text class="t" x="103" y="590" font-size="10">USB 1 → adaptador USB-C → micro-USB → ESP B</text>
  <!-- USB 2 → cabo → P4 → 1000 µF → +5V/GND da fita -->
  <path class="v5" d="M190 690 H330"/>
  <path class="gnd" d="M190 735 H330"/>
  <text class="t" x="260" y="684" font-size="10" text-anchor="middle">cabo USB 5 V</text>
  <rect class="box" x="330" y="676" width="60" height="72" rx="5"/>
  <text class="t" x="360" y="708" font-size="12" font-weight="bold" text-anchor="middle">P4</text>
  <text class="m" x="360" y="724" font-size="8.5" text-anchor="middle">fêmea | macho</text>
  <path class="v5" d="M390 690 H520"/>
  <path class="gnd" d="M390 735 H520"/>
  <circle class="dv5" cx="450" cy="690" r="3"/>
  <circle class="dgnd" cx="450" cy="735" r="3"/>
  <path class="l" d="M450 690 V706 M440 706 H460 M440 713 H460 M450 713 V735"/>
  <text class="t" x="466" y="714" font-size="9.5">1000 µF</text>
  <text class="tv5" x="526" y="694" font-size="10">+5V</text>
  <text class="tgnd" x="526" y="739" font-size="10">GND</text>
  <text class="m" x="360" y="772" font-size="9" text-anchor="middle">encaixar com o power bank desligado</text>

  <!-- Notas -->
  <rect class="box" x="590" y="604" width="385" height="174" rx="6"/>
  <text class="t" x="604" y="624" font-size="11" font-weight="bold">Como ler</text>
  <text class="t" x="604" y="642" font-size="10">• Rótulos iguais (+5V, GND, 3V3) estão ligados entre si.</text>
  <text class="t" x="604" y="658" font-size="10">• GND comum: power bank, ESP, conversor e as duas fitas.</text>
  <text class="t" x="604" y="674" font-size="10">• Cada ponta da fita tem 3 pontos: na entrada VCC, GND e DIN;</text>
  <text class="t" x="614" y="689" font-size="10">na saída, VCC, GND e DOUT. A ordem varia: siga a serigrafia.</text>
  <text class="t" x="604" y="705" font-size="10">• O sinal só anda no sentido da seta: a entrada é o lado DIN.</text>
  <text class="t" x="604" y="721" font-size="10">• Cores erradas: pull-up de 1–2,2 kΩ do HV1 ao +5V.</text>
  <text class="t" x="604" y="737" font-size="10">• Teto de corrente no firmware: começar em 1,3 A.</text>
  <text class="t" x="604" y="753" font-size="10">• Fios de 5 V e GND da fita: 22 AWG.</text>
  <text class="m" x="604" y="770" font-size="9">Cores: vermelho 5 V · cinza GND · laranja 3,3 V · verde dados</text>
</svg>
