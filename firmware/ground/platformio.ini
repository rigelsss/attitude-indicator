; ESP B — "ESTAÇÃO DE SOLO": recebe ESP-NOW, TFT/OLED, encoder, alarmes, AP Wi-Fi + WebSocket
[platformio]
; Página web fica fora do firmware, em ground-station/web (pio run -e ground -t uploadfs)
data_dir = ../../ground-station/web

[env:ground]
platform      = espressif32 @ 6.13.0   ; versões exatas: build reprodutível
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.filesystem = littlefs
upload_port   = COM7
monitor_port  = COM7
monitor_dtr   = 0   ; abrir/fechar o monitor não reinicia o B (DTR/RTS ligados ao EN e ao BOOT); o upload
monitor_rts   = 0   ; reinicia a placa por conta própria. A linha de boot não aparece: o c mostra o carimbo
; As duas placas usam a COM7 (uma de cada vez): a porta não identifica a placa.
; Antes de gravar (upload e uploadfs), o script confere o MAC e cancela se for a Placa A
extra_scripts    = pre:../shared/scripts/check_board_mac.py
                   pre:../shared/scripts/build_stamp.py   ; carimbo de compilação na linha de boot
custom_board_mac = 14:33:5C:03:8A:B4
build_src_filter = +<*> -<diag/>   ; o diagnóstico é o ambiente ground_diag

build_flags =
    -I ../shared/include
    -D CORE_DEBUG_LEVEL=3
    -D WEBSOCKETS_SERVER_CLIENT_MAX=8   ; IGUAL ao AP_MAX_CLIENTS do config.h (a biblioteca não vê o config.h)
    ; ---- TFT_eSPI configurado aqui (não editar a lib) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240          ; ajustar conforme o módulo (240x240 ou 240x320)
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5                ; -1 se o módulo não tiver pino CS
    -D TFT_DC=16
    -D TFT_RST=17
    ; sem TFT_BL: o BLK do módulo vai no 3V3 (luz de fundo sempre acesa; docs/solo.md, passo 0)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43                  ; TFT + sprites (desenho sem flicker)
    olikraus/U8g2 @ 2.36.18                   ; OLED 0,96" 128x64
    links2004/WebSockets @ 2.7.3              ; servidor WebSocket :81
    bblanchon/ArduinoJson @ 7.4.3

[env:ground_diag]
; Diagnóstico do hardware do B (passo 0 da semana 4, docs/solo.md): LEDs, I2C, OLED, encoder, TFT e sprite.
; Compila só src/diag/ e o carimbo (sem main.cpp nem as tasks). Gravar: pio run -e ground_diag -t upload;
; depois, regravar o ground
extends          = env:ground
build_src_filter = +<diag/> +<build_info.cpp>

[env:native]
platform    = native
build_flags = -I ../shared/include
test_build_src = no
; ArduinoJson também no PC: o lib/web_json (mensagens do WebSocket) é testado no native
lib_deps    = bblanchon/ArduinoJson @ 7.4.3
