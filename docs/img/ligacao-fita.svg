<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="1000" height="940" role="img" aria-labelledby="titulo">
  <title id="titulo">Ligação da fita de LEDs no ESP B, com a tampa removível: os dois anéis ficam na tampa (o de cima e o da borda), em série. Na base, GPIO 27 e conversor BSS138; pela abertura passa um conector JST SM de 3 vias (+5V, GND e dados): a metade da tampa é o JST da entrada do rolo, soldado no anel de cima; a metade da base é o JST da ponta de saída do rolo, cortado com os fios, emendado no fio de 22 AWG do cabo USB cortado da segunda saída do power bank e na saída HV do conversor. Na tampa, o capacitor de 1000 microfarads e o resistor de 330 ohms junto do DIN do primeiro LED; a corrente da fita vai do cabo USB direto ao JST, sem passar pela protoboard. O DOUT do anel de cima vai direto ao DIN do anel da borda. Potenciômetro do brilho no GPIO 34</title>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .l { stroke: #1f2328; fill: none; stroke-width: 1.4; }
    .box { stroke: #1f2328; fill: #8c959f; fill-opacity: .10; stroke-width: 1.4; }
    .zone { stroke: #8c959f; fill: none; stroke-width: 1; stroke-dasharray: 2 4; }
    .strip { stroke: #1f2328; fill: #8c959f; fill-opacity: .18; stroke-width: 1.2; }
    .led { fill: #ffffff; stroke: #8c959f; }
    .pad { fill: #d4a72c; stroke: #9a6700; stroke-width: .8; }
    .v5 { stroke: #d1242f; fill: none; stroke-width: 2; }
    .gnd { stroke: #57606a; fill: none; stroke-width: 2; }
    .v33 { stroke: #bc4c00; fill: none; stroke-width: 2; }
    .dat { stroke: #1a7f37; fill: none; stroke-width: 2; }
    .g { stroke: #59636e; fill: none; stroke-width: 1; }
    .tv5 { fill: #d1242f; font-weight: bold; }
    .tgnd { fill: #57606a; font-weight: bold; }
    .tv33 { fill: #bc4c00; font-weight: bold; }
    .tdat { fill: #1a7f37; font-weight: bold; }
    .dv5 { fill: #d1242f; }
    .dgnd { fill: #57606a; }
    .ddat { fill: #1a7f37; }
    .div { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .l, .box, .strip { stroke: #e6edf3; }
      .led { fill: #0d1117; stroke: #9198a1; }
      .gnd { stroke: #9198a1; }
      .tgnd, .dgnd { fill: #9198a1; }
      .dat { stroke: #3fb950; }
      .tdat, .ddat { fill: #3fb950; }
      .v33 { stroke: #f0883e; }
      .tv33 { fill: #f0883e; }
      .v5 { stroke: #ff6a69; }
      .tv5, .dv5 { fill: #ff6a69; }
      .g { stroke: #9198a1; }
      .bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="940"/>
  <text class="t" x="500" y="24" font-size="16" font-weight="bold" text-anchor="middle">ESP B: fita de LEDs em dois anéis na tampa removível</text>

  <!-- ===== TAMPA ===== -->
  <rect class="zone" x="10" y="38" width="980" height="342" rx="8"/>
  <text class="t" x="24" y="60" font-size="13" font-weight="bold">TAMPA (sai inteira)</text>
  <text class="m" x="24" y="78" font-size="10">JST-1 (vem soldado na entrada do rolo): +5V, GND e DIN; o 330 Ω e o capacitor ficam aqui na tampa</text>
  <text class="m" x="24" y="93" font-size="10">TFT e OLEDs têm os próprios conectores</text>

  <rect class="strip" x="500" y="110" width="430" height="42" rx="5"/>
  <rect class="led" x="545" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="571" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="597" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="623" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="649" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="675" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="701" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="727" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="753" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="779" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="805" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="831" y="125" width="11" height="11" rx="2"/>
  <rect class="led" x="857" y="125" width="11" height="11" rx="2"/>
  <rect class="pad" x="492" y="115" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="122" font-size="8.5">VCC</text>
  <rect class="pad" x="492" y="128" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="135" font-size="8.5">GND</text>
  <rect class="pad" x="492" y="141" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="148" font-size="8.5">DIN</text>
  <rect class="pad" x="928" y="115" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="122" font-size="8.5" text-anchor="end">VCC</text>
  <rect class="pad" x="928" y="128" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="135" font-size="8.5" text-anchor="end">GND</text>
  <rect class="pad" x="928" y="141" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="148" font-size="8.5" text-anchor="end">DOUT</text>
  <text class="t" x="715" y="170" font-size="11" text-anchor="middle">Anel de cima (face da tampa): ~32 LEDs, sem canaleta, cantos com pontes de fio</text>
  <line class="g" x1="620" y1="102" x2="810" y2="102" marker-end="url(#seta)"/>
  <text class="m" x="715" y="97" font-size="9" text-anchor="middle">sentido dos dados (seta impressa na fita)</text>
  <text class="m" x="926" y="88" font-size="9" text-anchor="end">VCC e GND da saída: sem ligação</text>
  <!-- força do anel de cima, na entrada -->
  <path class="v5" d="M492 118.5 H468"/>
  <text class="tv5" x="464" y="122" font-size="10" text-anchor="end">+5V</text>
  <path class="gnd" d="M492 131.5 H468"/>
  <text class="tgnd" x="464" y="135" font-size="10" text-anchor="end">GND</text>
  <!-- DIN do anel de cima, vindo da base pelo conector -->
  <path class="dat" d="M345 395 V280 M345 240 V144.5 H492"/>
  <rect class="l" x="339" y="240" width="12" height="40" rx="2"/>
  <text class="t" x="333" y="258" font-size="10" text-anchor="end">330 Ω</text>
  <text class="m" x="333" y="270" font-size="8.5" text-anchor="end">perto do 1º LED</text>
  <text class="tdat" x="339" y="200" font-size="10" text-anchor="end">DIN</text>
  <!-- DOUT do anel de cima direto no DIN do anel da borda, dentro da tampa -->
  <path class="dat" d="M938 144.5 H962 V205 H470 V286.5 H492"/>
  <text class="tdat" x="716" y="200" font-size="10" text-anchor="middle">DOUT do anel de cima → DIN do anel da borda (dentro da tampa)</text>

  <rect class="strip" x="500" y="252" width="430" height="42" rx="5"/>
  <rect class="led" x="545" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="571" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="597" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="623" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="649" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="675" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="701" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="727" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="753" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="779" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="805" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="831" y="267" width="11" height="11" rx="2"/>
  <rect class="led" x="857" y="267" width="11" height="11" rx="2"/>
  <rect class="pad" x="492" y="257" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="264" font-size="8.5">VCC</text>
  <rect class="pad" x="492" y="270" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="277" font-size="8.5">GND</text>
  <rect class="pad" x="492" y="283" width="10" height="7" rx="1"/>
  <text class="t" x="506" y="290" font-size="8.5">DIN</text>
  <rect class="pad" x="928" y="257" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="264" font-size="8.5" text-anchor="end">VCC</text>
  <rect class="pad" x="928" y="270" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="277" font-size="8.5" text-anchor="end">GND</text>
  <rect class="pad" x="928" y="283" width="10" height="7" rx="1"/>
  <text class="t" x="924" y="290" font-size="8.5" text-anchor="end">DOUT</text>
  <text class="t" x="715" y="312" font-size="11" text-anchor="middle">Anel da borda da tampa: ~32 LEDs, na canaleta (contorna os cantos sem cortar)</text>
  <line class="g" x1="620" y1="244" x2="810" y2="244" marker-end="url(#seta)"/>
  <text class="m" x="715" y="239" font-size="9" text-anchor="middle">sentido dos dados (seta impressa na fita)</text>
  <text class="m" x="926" y="230" font-size="9" text-anchor="end">DOUT do fim: sem ligação</text>
  <text class="m" x="500" y="328" font-size="9">VCC e GND da entrada: sem ligação (a força entra pela outra ponta)</text>
  <!-- força do anel da borda, pela ponta de saída -->
  <path class="v5" d="M938 260.5 H958"/>
  <text class="tv5" x="962" y="264" font-size="10">+5V</text>
  <path class="gnd" d="M938 273.5 H958"/>
  <text class="tgnd" x="962" y="277" font-size="10">GND</text>

  <!-- JST-1 (lado da tampa) e capacitor nos fios soltos da entrada do rolo -->
  <path class="gnd" d="M420 384 V345 H640"/>
  <path class="v5" d="M450 384 V365 H640"/>
  <circle class="dgnd" cx="600" cy="345" r="3"/>
  <circle class="dv5" cx="600" cy="365" r="3"/>
  <path class="l" d="M600 345 V351 M590 351 H610 M590 358 H610 M600 358 V365"/>
  <text class="t" x="584" y="358" font-size="9.5" text-anchor="end">1000 µF</text>
  <text class="tgnd" x="644" y="349" font-size="10">GND</text>
  <text class="tv5" x="644" y="369" font-size="10">+5V</text>
  <text class="m" x="676" y="352" font-size="9">→ para os dois anéis. Capacitor nos dois fios soltos</text>
  <text class="m" x="676" y="364" font-size="9">(vermelho e branco) da entrada do rolo; faixa no GND</text>
  <text class="m" x="333" y="232" font-size="8.5" text-anchor="end">no fio verde do rabicho</text>

  <!-- ===== divisa ===== -->
  <line class="div" x1="10" y1="395" x2="990" y2="395"/>
  <rect class="bg" x="560" y="386" width="250" height="18"/>
  <text class="m" x="685" y="399" font-size="10" text-anchor="middle">abertura da caixa (tampa | base)</text>
  <rect class="box" x="333" y="384" width="129" height="22" rx="4"/>
  <circle class="ddat" cx="345" cy="395" r="3.5"/>
  <circle class="dgnd" cx="420" cy="395" r="3.5"/>
  <circle class="dv5" cx="450" cy="395" r="3.5"/>
  <rect class="bg" x="362" y="389" width="40" height="12"/>
  <text class="m" x="382" y="399" font-size="8.5" text-anchor="middle">JST SM</text>
  <rect class="bg" x="100" y="386" width="228" height="18"/>
  <text class="t" x="326" y="399" font-size="10.5" text-anchor="end">conector JST de 3 vias (desencaixa) →</text>
  <rect class="bg" x="468" y="384" width="90" height="22"/>
  <text class="m" x="471" y="392" font-size="8">cima: JST-1 (entrada)</text>
  <text class="m" x="471" y="403" font-size="8">baixo: JST-2 (saída)</text>

  <!-- ===== BASE ===== -->
  <rect class="zone" x="10" y="410" width="980" height="520" rx="8"/>
  <text class="t" x="24" y="432" font-size="13" font-weight="bold">BASE</text>

  <!-- base: rabicho do JST-2 (ponta de saída do rolo, cortada) emendado nos fios da base -->
  <path class="l" d="M339 434 L351 446 M351 434 L339 446"/>
  <path class="l" d="M414 434 L426 446 M426 434 L414 446"/>
  <path class="l" d="M444 446 L456 458 M456 446 L444 458"/>
  <text class="m" x="464" y="430" font-size="9">✕ emendas soldadas no rabicho do JST-2 (~15 cm):</text>
  <text class="tv5" x="464" y="443" font-size="9">vermelho do JST ↔ seu 22 AWG vermelho</text>
  <text class="tgnd" x="464" y="455" font-size="9">branco do JST (GND) ↔ seu 22 AWG preto</text>
  <text class="tdat" x="464" y="467" font-size="9">verde do JST (dados) ↔ fio fino do HV1</text>
  <text class="m" x="464" y="479" font-size="8.5">cores típicas: conferir com o multímetro quando a fita chegar</text>
  <path class="gnd" d="M420 406 V830 H190"/>
  <path class="v5" d="M450 406 V875 H190"/>
  <!-- emenda: fios finos para a protoboard -->
  <circle class="dv5" cx="450" cy="700" r="3.5"/>
  <circle class="dgnd" cx="420" cy="716" r="3.5"/>
  <path class="v5" d="M450 700 H478" stroke-width="1.2"/>
  <text class="tv5" x="482" y="704" font-size="9.5">fio fino → HV do conversor</text>
  <path class="gnd" d="M420 716 H392" stroke-width="1.2"/>
  <text class="tgnd" x="388" y="720" font-size="9.5" text-anchor="end">fio fino → GND da protoboard (ESP)</text>
  <text class="m" x="458" y="740" font-size="9">↑ emenda soldada: o fio grosso</text>
  <text class="m" x="458" y="751" font-size="9">segue ao JST; os finos vão à protoboard</text>

  <!-- ESP32 B -->
  <rect class="box" x="30" y="445" width="130" height="175" rx="6"/>
  <text class="t" x="95" y="466" font-size="13" font-weight="bold" text-anchor="middle">ESP32 B</text>
  <text class="t" x="152" y="484" font-size="10" text-anchor="end">GPIO 27</text>
  <text class="t" x="152" y="519" font-size="10" text-anchor="end">3V3</text>
  <text class="t" x="152" y="554" font-size="10" text-anchor="end">GND</text>
  <text class="t" x="152" y="589" font-size="10" text-anchor="end">GPIO 34</text>
  <text class="t" x="95" y="614" font-size="9.5" text-anchor="middle">micro-USB</text>

  <!-- Conversor BSS138 -->
  <rect class="box" x="220" y="452" width="100" height="112" rx="6"/>
  <text class="t" x="270" y="469" font-size="9.5" font-weight="bold" text-anchor="middle">Conversor BSS138</text>
  <text class="t" x="226" y="484" font-size="9.5">LV1</text>
  <text class="t" x="226" y="519" font-size="9.5">LV</text>
  <text class="t" x="226" y="554" font-size="9.5">GND</text>
  <text class="t" x="314" y="484" font-size="9.5" text-anchor="end">HV1</text>
  <text class="t" x="314" y="519" font-size="9.5" text-anchor="end">HV</text>
  <text class="t" x="314" y="554" font-size="9.5" text-anchor="end">GND</text>
  <text class="m" x="270" y="537" font-size="8.5" text-anchor="middle">3,3 V → 5 V</text>
  <path class="dat" d="M160 480 H220"/>
  <path class="v33" d="M160 515 H220"/>
  <path class="gnd" d="M160 550 H220"/>
  <path class="v5" d="M320 515 H342"/>
  <text class="tv5" x="346" y="519" font-size="10">+5V</text>
  <path class="gnd" d="M320 550 H342"/>
  <text class="tgnd" x="346" y="554" font-size="10">GND</text>
  <!-- HV1 → verde do JST-2 (o 330 Ω fica na tampa) -->
  <path class="dat" d="M320 480 H345 V395"/>

  <!-- Potenciômetro do brilho -->
  <path class="dat" d="M160 585 H290"/>
  <circle class="ddat" cx="250" cy="585" r="3"/>
  <path class="dat" d="M250 585 V640" marker-end="url(#seta)"/>
  <rect class="l" x="215" y="644" width="70" height="13" rx="2"/>
  <path class="v33" d="M215 650.5 H196"/>
  <text class="tv33" x="192" y="654" font-size="10" text-anchor="end">3V3</text>
  <path class="gnd" d="M285 650.5 H304"/>
  <text class="tgnd" x="308" y="654" font-size="10">GND</text>
  <path class="l" d="M290 585 V596 M281 596 H299 M281 602 H299 M290 602 V612"/>
  <text class="tgnd" x="290" y="624" font-size="10" text-anchor="middle">GND</text>
  <text class="t" x="304" y="602" font-size="9.5">100 nF</text>
  <text class="t" x="250" y="675" font-size="10" text-anchor="middle">Potenciômetro 10 kΩ (brilho)</text>
  <text class="m" x="250" y="688" font-size="9" text-anchor="middle">extremos no 3V3, nunca no 5 V</text>

  <!-- Power bank -->
  <rect class="box" x="30" y="770" width="160" height="130" rx="8"/>
  <text class="t" x="110" y="836" font-size="13" font-weight="bold" text-anchor="middle">Power bank</text>
  <text class="t" x="95" y="788" font-size="9.5" text-anchor="middle">USB 1</text>
  <text class="t" x="184" y="854" font-size="9.5" text-anchor="end">USB 2</text>
  <path class="v5" d="M95 770 V620"/>
  <text class="t" x="103" y="752" font-size="10">USB 1 (USB-C) → adaptador → micro-USB → ESP B</text>
  <text class="t" x="300" y="822" font-size="10" text-anchor="middle">USB 2: cabo USB cortado + fio 22 AWG flexível estanhado</text>
  <text class="tgnd" x="300" y="846" font-size="9.5" text-anchor="middle">preto: GND</text>
  <text class="tv5" x="300" y="891" font-size="9.5" text-anchor="middle">vermelho: +5V</text>
  <text class="m" x="300" y="912" font-size="9" text-anchor="middle">isolar o verde e o branco; conferir a polaridade com o multímetro</text>

  <!-- Notas -->
  <rect class="box" x="628" y="492" width="357" height="238" rx="6"/>
  <text class="t" x="642" y="512" font-size="11" font-weight="bold">Como ler</text>
  <text class="t" x="642" y="530" font-size="10">• Rótulos iguais (+5V, GND, 3V3) estão ligados entre si.</text>
  <text class="t" x="642" y="546" font-size="10">• GND comum: power bank, ESP, conversor e as duas fitas.</text>
  <text class="t" x="642" y="562" font-size="10">• O rolo traz um JST em cada ponta, e os dois se encaixam:</text>
  <text class="t" x="652" y="577" font-size="10">o da entrada fica na tampa; o da saída, cortado, na base.</text>
  <text class="t" x="642" y="593" font-size="10">• Cada ponta da fita tem 3 pontos: na entrada +5V, GND e DI;</text>
  <text class="t" x="652" y="608" font-size="10">na saída, +5V, GND e DO. A ordem varia: siga a serigrafia.</text>
  <text class="t" x="642" y="624" font-size="10">• O sinal só anda no sentido da seta: a entrada é o lado DI.</text>
  <text class="t" x="642" y="640" font-size="10">• Cores erradas: pull-up de 1–2,2 kΩ do HV1 ao +5V.</text>
  <text class="t" x="642" y="656" font-size="10">• Teto de corrente no firmware: 1,3 A.</text>
  <text class="t" x="642" y="672" font-size="10">• Encaixar o JST com o cabo fora do power bank.</text>
  <text class="t" x="642" y="688" font-size="10">• A corrente da fita não passa pela protoboard.</text>
  <text class="t" x="642" y="704" font-size="10">• Rolo sem JST na saída: par JST SM 3 vias, ou os dois P4.</text>
  <text class="m" x="642" y="722" font-size="9">Cores: vermelho 5 V · cinza GND · laranja 3,3 V · verde dados</text>
</svg>
